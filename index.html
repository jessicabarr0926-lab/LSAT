<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JessiPreps</title>
    <link rel="stylesheet" href="./jessipreps.css" />
  </head>
  <body class="sidebar-collapsed">
    <a class="skip-link" href="#pageMount">Skip to main content</a>
    <button id="sidebarToggle" class="sidebar-fab" aria-label="Toggle sidebar">☰</button>
    <div class="app-shell">
      <aside class="sidebar" id="sidebarPanel">
        <div class="sidebar__toolbar">
          <button id="sidebarClose" class="sidebar__close" aria-label="Close sidebar">×</button>
        </div>
        <div class="brand">
          <div class="brand__text">
            <p class="eyebrow">Personal LSAT Operating System</p>
            <h1>JessiPreps</h1>
            <p class="muted">Premium study flow built to remove decision fatigue.</p>
          </div>
        </div>

        <nav class="nav" id="navRail"></nav>

        <section class="sidebar-card">
          <p class="sidebar-card__label">Accessibility</p>
          <div id="settingsPanel" class="settings-grid"></div>
        </section>

        <section class="sidebar-card" id="todaySidebarCard">
          <p class="sidebar-card__label">Today</p>
          <div id="todayCard"></div>
        </section>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p id="routeEyebrow" class="eyebrow">Dashboard</p>
            <h2 id="routeTitle">Command Center</h2>
          </div>
          <div class="topbar__actions">
            <label class="topbar-search" aria-label="Global search">
              <span>Search</span>
              <input id="globalSearch" type="search" placeholder="Lesson, drill, question..." />
            </label>
            <button id="commandPaletteButton" class="icon-button" type="button" aria-label="Open command palette">⌘K</button>
            <button id="quickStart" class="button button--primary" aria-label="Start today's sprint">Sprint</button>
            <button id="openWeakest" class="button button--ghost" aria-label="Open weakest skill drill">Weak skill</button>
            <button id="notificationBell" class="icon-button" type="button" aria-label="0 unread notifications">0</button>
            <button id="subscribeCta" class="button button--ghost" type="button">Subscribe</button>
            <button id="profileChip" class="profile-chip" type="button" aria-label="Open profile menu">JB</button>
          </div>
        </header>

        <section id="heroMount"></section>
        <section id="pageMount" class="page-grid"></section>
        <section id="noticeMount"></section>
        <footer class="app-footer">
          <span>© JessiPreps</span>
          <a href="#/dashboard">About</a>
          <a href="mailto:jessipreps@example.com">Contact</a>
          <a href="#/plan">Methodology</a>
          <a href="#/plan">Privacy</a>
        </footer>
      </main>
    </div>

    <script src="./content.js"></script>
    <script src="./requested-lessons-data.js"></script>
    <script src="./video-lesson-map.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
